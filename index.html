<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="./CSS/style.css" />
    <title>IZOO</title>
</head>

<body>
    <div class="container">
        <div class="second-sec">
            <div class="logo-img">
                <img src="./Images/ZOO LOGO red 3.png" alt="I'ZOO Logo">
            </div>

            <div class="tree-container">
                <img src="./Images/freepik_br_c2acc06c-1f6d-4e2c-a091-075fbe381826.png" alt="Tree with birds"
                    class="tree-img">
            </div>
        </div>

        <div class="third-sec">
            <div class="cat-container">
                <img src="./Images/Cat-img.png" alt="Cat" class="cat-img">
            </div>
            <div class="buttons-container">
                <button class="button" onclick="handleButtonClick(1)"></button>
                <button class="button" onclick="handleButtonClick(2)"></button>
                <button class="button" onclick="handleButtonClick(3)"></button>
                <button class="button" onclick="handleButtonClick(4)"></button>
                <button class="button" onclick="handleButtonClick(5)"></button>
            </div>
            <div class="footer-container">
                <img src="./Images/Footer-image.png" alt="">
            </div>
        </div>




    </div>


    <script>
        function handleButtonClick(buttonNumber) {
            console.log(`Button ${buttonNumber} clicked`);
            // Add your button functionality here
            alert(`Button ${buttonNumber} clicked!`);
        }
    </script>
</body>

</html>
