<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover" />
      <link rel="icon" href="./Icons/ZOO LOGO red 3.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&family=Inconsolata:wght@200..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="./CSS/style.css" />
    <title>IZOO</title>
  </head>

  <body>
    <div class="section">
      <div class="container">
        <div class="second-sec">
          <div class="logo-img">
            <img src="./Images/ZOO LOGO red 3.png" alt="I'ZOO Logo" />
          </div>
          <div class="tree-container">
            <img
              src="./Images/freepik_br_c2acc06c-1f6d-4e2c-a091-075fbe381826.png"
              alt="Tree with birds"
              class="tree-img" />
          </div>
        </div>
        <div class="third-sec">
          <div class="cat-container">
            <img src="./Images/Cat-img.png" alt="Cat" class="cat-img" />
          </div>
          <div class="buttons-container" aria-label="Quick links">
            <a
              class="pill"
              href="https://www.instagram.com/izoo_sa?igsh=YzR3MHVneHVvdnU4
"
              aria-label="Instagram"
              data-action="1"
              >Instagram</a
            >
            <a class="pill" href="" aria-label="Salla Website" data-action="2"
              >Izooltd.com</a
            >
            <a
              class="pill"
              href="mailto:info@izooltd.com"
              onclick="setTimeout(function(){
                    window.open(`'https://outlook.office.com/mail/deeplink/compose?to=info@izooltd.com','_blank'`);
                }, 400)">
              Email
            </a>

            <a
              class="pill"
              href="https://maps.app.goo.gl/Ai1s6QKW3Msu4iNN8?g_st=ac"
              aria-label="Location"
              target="_blank"
              rel="noopener"
              >Location</a
            >
            <a
              class="pill"
              href="https://wa.me/966557004097"
              aria-label="WhatsApp"
              data-action="5"
              >Whatsapp</a
            >
            <a
              class="pill"
              href="https://wa.me/966557004097"
              aria-label="Tiktok"
              data-action="6"
              >Tiktok</a
            >
          </div>

          <div class="footer-container">
            <img src="./Images/Footer-image.png" alt="" />
          </div>
        </div>
      </div>
      
    </div>
  </body>
</html>
