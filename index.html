<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="./CSS/style.css" />
    <title>IZOO</title>
</head>

<body>
    <div class="container">
        <div class="second-sec">
            <div class="logo-img">
                <img src="./Images/ZOO LOGO red 3.png" alt="I'ZOO Logo">
            </div>
            <div class="tree-container">
                <img src="./Images/freepik_br_c2acc06c-1f6d-4e2c-a091-075fbe381826.png" alt="Tree with birds"
                    class="tree-img">
            </div>
        </div>
        <div class="third-sec">
            <div class="cat-container">
                <img src="./Images/Cat-img.png" alt="Cat" class="cat-img">
            </div>
            <div class="buttons-container" aria-label="Quick links">
                <a class="pill" href="" aria-label="Instagram" data-action="1">Instagram</a>
                <a class="pill" href="" aria-label="Salla Website" data-action="2">Izooltd.com</a>
                <a class="pill" href="" aria-label="Location" data-action="3">Email</a>
                <a class="pill" href="" aria-label="Email" data-action="4">Location</a>
                <a class="pill" href="" aria-label="WhatsApp" data-action="5">Whatsapp</a>
            </div>

            <div class="footer-container">
                <img src="./Images/Footer-image.png" alt="">
            </div>
        </div>




    </div>
</body>

</html>
